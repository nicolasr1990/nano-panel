<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nano Resto Bar · Panel del local</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0c; --bg-elevated:#121216; --surface:rgba(255,255,255,0.04); --surface-hover:rgba(255,255,255,0.08);
    --glass:rgba(255,255,255,0.05); --glass-border:rgba(255,255,255,0.07); --glass-border-hover:rgba(255,255,255,0.14);
    --accent:#e88c3c; --accent-light:#f5b56a; --accent-glow:rgba(232,140,60,0.25);
    --ember:#e85a3c; --text:#f2f0ec; --text-secondary:#9a9590; --text-muted:#5c5a56;
    --success:#4ade80; --warning:#f5c96a; --danger:#ef4444;
    /* Colores por tipo de pedido — para que se distingan de un vistazo sobre el fondo oscuro */
    --tipo-mesa:#e8b23c; --tipo-mesa-bg:rgba(232,178,60,0.13); --tipo-mesa-border:rgba(232,178,60,0.35);
    --tipo-retiro:#4dd0c8; --tipo-retiro-bg:rgba(77,208,200,0.13); --tipo-retiro-border:rgba(77,208,200,0.35);
    --tipo-envio:#b487e8; --tipo-envio-bg:rgba(180,135,232,0.13); --tipo-envio-border:rgba(180,135,232,0.35);
    --radius-sm:10px; --radius-md:14px; --radius-lg:18px; --radius-xl:24px;
    --shadow-sm:0 2px 8px rgba(0,0,0,0.3); --shadow-md:0 8px 32px rgba(0,0,0,0.4);
    --display:'Space Grotesk',sans-serif; --body:'Inter',-apple-system,sans-serif;
    --transition:all 0.3s cubic-bezier(0.4,0,0.2,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{margin:0;background:var(--bg);font-family:var(--body);color:var(--text);overflow-x:hidden;-webkit-font-smoothing:antialiased}
  .wrap{max-width:430px;margin:0 auto;position:relative;min-height:100vh}
  #app-local{
    min-height:100vh;position:relative;overflow:hidden;padding:18px 16px 100px;
    background:radial-gradient(600px 400px at 20% -5%,rgba(232,140,60,0.08),transparent 60%),
      radial-gradient(400px 300px at 100% 10%,rgba(232,90,60,0.06),transparent 55%),
      linear-gradient(180deg,var(--bg) 0%,var(--bg-elevated) 100%);
  }
  #app-local::before{content:'';position:fixed;width:250px;height:250px;border-radius:50%;
    background:radial-gradient(circle,rgba(232,140,60,0.10),transparent 70%);top:-60px;right:-60px;filter:blur(50px);pointer-events:none}

  /* Top */
  .local-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
  .local-h{font-family:var(--display);font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:var(--accent);font-weight:600}
  .local-h a{color:var(--text-secondary);text-decoration:none;font-size:11px;letter-spacing:0.08em;text-transform:none;font-family:var(--body);transition:color 0.2s}
  .local-h a:hover{color:var(--accent-light)}
  .local-title{font-family:var(--display);font-size:24px;font-weight:700;color:var(--text);margin:6px 0 4px;letter-spacing:-0.02em}
  .local-sub{font-family:var(--body);font-size:12.5px;color:var(--text-secondary);margin-bottom:20px}

  .editar-menu-btn{
    font-family:var(--body);font-size:11.5px;font-weight:600;letter-spacing:0.02em;padding:7px 13px;
    border-radius:var(--radius-xl);border:1px solid var(--glass-border-hover);
    background:linear-gradient(135deg,rgba(232,140,60,0.18),rgba(232,90,60,0.1));
    color:var(--accent-light);cursor:pointer;transition:var(--transition);white-space:nowrap;
  }
  .editar-menu-btn:hover{background:linear-gradient(135deg,rgba(232,140,60,0.28),rgba(232,90,60,0.16));transform:translateY(-1px)}

  /* Filters */
  .filters{display:flex;gap:8px;margin-bottom:18px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .filters button{
    flex:0 0 auto;font-family:var(--body);font-size:12px;font-weight:500;letter-spacing:0.02em;padding:8px 14px;border-radius:var(--radius-xl);
    border:1px solid var(--glass-border);background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    color:var(--text-secondary);cursor:pointer;transition:var(--transition);white-space:nowrap;
  }
  .filters button:hover{border-color:var(--glass-border-hover);color:var(--text)}
  .filters button.active{
    background:linear-gradient(135deg,rgba(232,140,60,0.25),rgba(232,90,60,0.15));
    border-color:rgba(232,140,60,0.4);color:var(--accent-light);
    box-shadow:0 4px 16px rgba(232,140,60,0.15),inset 0 1px 0 rgba(255,255,255,0.08);
  }

  /* Chip de tipo de pedido — el color que "sobresale" sobre el fondo negro */
  .tipo-chip{
    display:inline-flex;align-items:center;gap:5px;font-family:var(--body);font-size:10.5px;font-weight:700;
    letter-spacing:0.06em;text-transform:uppercase;padding:4px 9px;border-radius:var(--radius-sm);
  }
  .tipo-chip svg{width:12px;height:12px}
  .tipo-chip.mesa{background:var(--tipo-mesa-bg);color:var(--tipo-mesa);border:1px solid var(--tipo-mesa-border)}
  .tipo-chip.retiro{background:var(--tipo-retiro-bg);color:var(--tipo-retiro);border:1px solid var(--tipo-retiro-border)}
  .tipo-chip.envio{background:var(--tipo-envio-bg);color:var(--tipo-envio);border:1px solid var(--tipo-envio-border)}

  /* Grupo de mesa (contiene varias rondas) */
  .mesa-group{
    border-radius:var(--radius-lg);margin-bottom:16px;padding:14px 14px 16px;
    background:linear-gradient(180deg,rgba(232,178,60,0.05),transparent 40%);
    border:1px solid var(--tipo-mesa-border);
  }
  .mesa-group-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:0 2px}
  .mesa-group-head .titulo{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:15px;color:var(--text)}
  .mesa-group-head .total{font-family:var(--display);font-size:14px;color:var(--tipo-mesa);font-weight:700}
  .cerrar-mesa-btn{
    width:100%;margin-top:10px;padding:11px;border-radius:var(--radius-md);border:1px solid var(--tipo-mesa-border);
    background:linear-gradient(135deg,var(--tipo-mesa),#c98f2e);color:#1a1200;font-family:var(--body);font-weight:700;
    font-size:12.5px;letter-spacing:0.02em;cursor:pointer;transition:var(--transition);
  }
  .cerrar-mesa-btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(232,178,60,0.3)}

  /* Order Cards */
  .order-card{
    background:var(--glass);border:1px solid var(--glass-border);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-radius:var(--radius-lg);padding:16px 18px;margin-bottom:14px;
    border-left:3px solid transparent;transition:var(--transition);
    animation:slideUp 0.35s ease backwards;
  }
  /* Toda la tarjeta se tiñe según el tipo de pedido */
  .order-card.tipo-mesa{background:linear-gradient(155deg,var(--tipo-mesa-bg),rgba(255,255,255,0.03) 65%);border-color:var(--tipo-mesa-border)}
  .order-card.tipo-retiro{background:linear-gradient(155deg,var(--tipo-retiro-bg),rgba(255,255,255,0.03) 65%);border-color:var(--tipo-retiro-border)}
  .order-card.tipo-envio{background:linear-gradient(155deg,var(--tipo-envio-bg),rgba(255,255,255,0.03) 65%);border-color:var(--tipo-envio-border)}
  .mesa-group .order-card{margin-bottom:10px}
  .mesa-group .order-card:last-child{margin-bottom:0}
  .order-card:hover{transform:translateY(-1px);box-shadow:var(--shadow-md)}
  /* El estado sigue marcado en el borde izquierdo, encima del color de tipo */
  .order-card.nuevo{border-left-color:var(--danger)}
  .order-card.prep{border-left-color:var(--warning)}
  .order-card.listo{border-left-color:var(--success)}

  .order-card .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
  .order-card .head .src{font-family:var(--display);font-size:13px;font-weight:600;color:var(--text);letter-spacing:-0.01em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .status-pill{
    font-family:var(--body);font-size:10.5px;padding:4px 10px;border-radius:var(--radius-sm);font-weight:700;letter-spacing:0.04em;
    text-transform:uppercase;flex-shrink:0;
  }
  .status-pill.nuevo{background:rgba(239,68,68,0.12);color:var(--danger);border:1px solid rgba(239,68,68,0.25)}
  .status-pill.prep{background:rgba(245,201,106,0.12);color:var(--warning);border:1px solid rgba(245,201,106,0.25)}
  .status-pill.listo{background:rgba(74,222,128,0.12);color:var(--success);border:1px solid rgba(74,222,128,0.25)}

  .order-card ul{list-style:none;padding:0;margin:0 0 14px}
  .order-card li{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--glass-border)}
  .order-card li:last-child{border-bottom:none}
  .order-card li .line{flex:1;min-width:0;font-size:13.5px;color:var(--text)}
  .order-card li .note{display:block;font-size:11.5px;color:var(--accent-light);margin-top:2px;opacity:0.8}

  .order-actions{display:flex;gap:8px;flex-wrap:wrap}
  .order-actions button{
    flex:1;min-width:100px;padding:10px;border-radius:var(--radius-md);border:1px solid var(--glass-border);
    background:var(--surface);color:var(--text-secondary);font-family:var(--body);font-size:12.5px;
    font-weight:600;cursor:pointer;transition:var(--transition);letter-spacing:0.01em;
  }
  .order-actions button:hover{background:var(--surface-hover);color:var(--text);border-color:var(--glass-border-hover)}
  .order-actions button.primary{
    background:linear-gradient(135deg,var(--accent-light),var(--accent));color:#1a0f00;border-color:transparent;
    box-shadow:0 4px 16px rgba(232,140,60,0.3);flex:2;
  }
  .order-actions button.primary:hover{transform:translateY(-1px);box-shadow:0 6px 22px rgba(232,140,60,0.4)}
  .order-actions button.primary:active{transform:scale(0.97)}
  .order-actions button.deshacer{opacity:0.75;flex:1;font-size:11.5px}
  .order-actions button.deshacer:hover{color:var(--danger);border-color:rgba(239,68,68,0.3)}

  .empty-orders{color:var(--text-muted);text-align:center;padding:60px 20px;font-size:14px}

  /* Toast */
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--bg-elevated);
    color:var(--text);padding:12px 20px;border-radius:var(--radius-md);font-size:13px;
    font-family:var(--body);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;
    max-width:340px;text-align:center;z-index:50;border:1px solid var(--glass-border);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    box-shadow:var(--shadow-md);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}

  /* Login overlay */
  #loginOverlay{
    position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;
    z-index:100;padding:20px;
  }
  #loginOverlay .box{
    width:100%;max-width:300px;background:var(--glass);border:1px solid var(--glass-border);
    border-radius:var(--radius-lg);padding:28px 24px;text-align:center;backdrop-filter:blur(14px);
  }
  #loginOverlay h2{font-family:var(--display);font-size:17px;margin-bottom:6px}
  #loginOverlay p{font-size:12px;color:var(--text-secondary);margin-bottom:18px}
  #loginOverlay input{
    width:100%;padding:12px 14px;border-radius:var(--radius-md);border:1px solid var(--glass-border);
    background:var(--surface);color:var(--text);font-family:var(--body);font-size:14px;text-align:center;
    letter-spacing:0.15em;margin-bottom:10px;outline:none;
  }
  #loginOverlay input:focus{border-color:var(--glass-border-hover)}
  #loginOverlay button{
    width:100%;padding:12px;border-radius:var(--radius-md);border:none;
    background:linear-gradient(135deg,var(--accent-light),var(--accent));color:#1a0f00;font-family:var(--body);
    font-weight:700;font-size:13px;cursor:pointer;
  }
  #loginOverlay .err{color:var(--danger);font-size:11.5px;margin-top:8px;min-height:14px}

  /* Módulo de productos */
  .cat-block{margin-bottom:20px}
  .cat-titulo{
    font-family:var(--display);font-size:13px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;
    color:var(--accent-light);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--glass-border);
  }
  .prod-row{
    display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
    background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--radius-md);
    padding:10px 12px;margin-bottom:8px;transition:var(--transition);
  }
  .prod-row.inactivo{opacity:0.45}
  .prod-nombre{font-size:13.5px;color:var(--text);flex:1 1 140px;min-width:110px}
  .prod-controles{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .prod-precio{display:flex;align-items:center;gap:3px;font-size:13px;color:var(--accent-light);font-weight:600}
  .prod-precio input{
    width:70px;background:var(--surface);border:1px solid var(--glass-border);border-radius:var(--radius-sm);
    color:var(--text);font-family:var(--body);font-size:13px;padding:5px 6px;
  }
  .switch-mini{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--text-secondary);cursor:pointer;user-select:none}
  .switch-mini input{accent-color:var(--accent);width:15px;height:15px;cursor:pointer}

  @keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  ::-webkit-scrollbar{width:3px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--glass-border);border-radius:3px}

  /* Comprobante de impresión — oculto en pantalla, solo visible al imprimir */
  #comprobante{display:none}
  @media print{
    @page{ size:A4; margin:0; }
    body *{visibility:hidden}
    #comprobante, #comprobante *{visibility:visible}
    #comprobante{
      display:block;position:absolute;top:6mm;left:6mm;
      width:92mm;                 /* ancho aprox. de un cuarto de A4, con margen para cortar */
      padding:5mm 6mm;
      color:#000;background:#fff;
      font-family:Arial,Helvetica,sans-serif;font-weight:700;
    }
    #comprobante .ticket-logo{text-align:center;margin-bottom:2mm}
    #comprobante .ticket-logo img{width:26mm;height:26mm;object-fit:contain}
    #comprobante .ticket-logo span{
      display:block;font-size:16px;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;color:#c9531f;
    }
    #comprobante .ticket-tag{text-align:center;font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:#666;margin-bottom:3mm}
    #comprobante h1{
      text-align:center;font-size:15px;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;
      border-top:2px dashed #000;border-bottom:2px dashed #000;padding:2.5mm 0;margin-bottom:3mm;
    }
    #comprobante .nota{font-size:12px;font-weight:700;text-align:center;color:#000;line-height:1.5}
    #comprobante .sep{border-top:2px dashed #000;margin:2.5mm 0}
    #comprobante .linea{display:flex;justify-content:space-between;gap:6px;font-size:14px;font-weight:800;padding:2mm 0}
    #comprobante .linea .cant{font-weight:800}
    #comprobante .item-nota{font-size:11px;font-weight:700;color:#333;padding-left:4mm;margin-bottom:1.5mm}
    #comprobante .cat-label{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:0.04em;color:#c9531f;margin-top:2.5mm}
    #comprobante .total{font-weight:800;font-size:17px;margin-top:2.5mm;padding-top:2.5mm;border-top:2px dashed #000}
    #comprobante .footer{text-align:center;font-size:12px;font-weight:800;color:#c9531f;margin-top:4mm}
    #comprobante .footer-sub{text-align:center;font-size:10px;font-weight:700;color:#888;margin-top:1mm}
  }
</style>
</head>
<body>

<!-- Login del módulo de productos (los pedidos NO piden esta clave) -->
<div id="loginOverlay" style="display:none">
  <div class="box">
    <h2>Editar menú</h2>
    <p>Ingresá la clave para modificar precios y disponibilidad</p>
    <input id="claveInput" type="password" placeholder="Clave">
    <button onclick="intentarLoginProductos()">Ingresar</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<div class="wrap">
  <div id="app-local">
    <div class="local-top">
      <div class="local-h">Nano Resto Bar</div>
      <button class="editar-menu-btn" onclick="abrirProductos()">✎ Editar menú</button>
    </div>
    <div id="vistaPedidos">
      <div class="local-title">Pedidos en curso</div>
      <div class="local-sub" id="countLine">Cargando pedidos…</div>
      <div class="filters" id="filters"></div>
      <div id="ordersList"></div>
    </div>

    <div id="vistaProductos" style="display:none">
      <div class="local-top" style="margin-bottom:14px">
        <div class="local-title" style="margin:0">Menú y precios</div>
        <div class="local-h"><a href="#" onclick="cerrarProductos();return false;">← Volver a pedidos</a></div>
      </div>
      <div class="local-sub" id="productosSub"></div>
      <div id="listaProductos"></div>
      <button class="cerrar-mesa-btn" style="margin-top:6px" onclick="guardarCambiosProductos()">Guardar cambios</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Se completa dinámicamente antes de cada window.print() -->
<div id="comprobante"></div>

<script>
/* ======================= CONFIG ======================= */
const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbwZbKOiZmtimoOVp8dt5wAehccD1J-fQTLfGLk8oMf6AAdFkoN1_G3x7zGoQXFHMHqubg/exec';
const POLL_MS = 8000; // cada cuánto se refresca la lista de pedidos sola

let CLAVE = '';         // se pide recién cuando se abre el módulo de productos/precios (no hace falta para ver pedidos)
let staffOrders = [];   // pedidos que trae el backend
let filter = 'todos';

/* ======================= INICIO ======================= */
// El panel de pedidos no pide login: se ve todo apenas se abre el HTML.
cargarPedidos();
setInterval(cargarPedidos, POLL_MS);

/* ======================= RED ======================= */
function postAction(action, data){
  return fetch(WEBAPP_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // evita preflight en Apps Script
    body: JSON.stringify({ action, ...data }), // la clave solo se manda desde las acciones del módulo de productos
  }).then(r => r.json()).catch(() => ({ ok:false, error:'sin_conexion' }));
}

function postActionConClave(action, data){
  return fetch(WEBAPP_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, clave: CLAVE, ...data }),
  }).then(r => r.json()).catch(() => ({ ok:false, error:'sin_conexion' }));
}

/* ======================= MÓDULO DE PRODUCTOS ======================= */
let productosData = [];
let categoriasData = [];
let cambiosProductos = {}; // { id: {precio, activo, disponible_mesa, disponible_retiro, disponible_envio} }

function abrirProductos(){
  document.getElementById('loginOverlay').style.display = 'flex';
  document.getElementById('claveInput').value = '';
  document.getElementById('loginErr').textContent = '';
  document.getElementById('claveInput').focus();
}

document.addEventListener('keydown', e => {
  if(e.key === 'Enter' && document.getElementById('loginOverlay').style.display === 'flex') intentarLoginProductos();
});

function intentarLoginProductos(){
  const val = document.getElementById('claveInput').value.trim();
  if(!val){ document.getElementById('loginErr').textContent = 'Ingresá la clave'; return; }
  CLAVE = val;
  fetch(`${WEBAPP_URL}?action=listarProductos&clave=${encodeURIComponent(CLAVE)}`)
    .then(r => r.json())
    .then(res => {
      if(!res.ok){
        document.getElementById('loginErr').textContent = 'Clave incorrecta';
        CLAVE = '';
        return;
      }
      productosData = res.productos;
      document.getElementById('loginOverlay').style.display = 'none';
      document.getElementById('vistaPedidos').style.display = 'none';
      document.getElementById('vistaProductos').style.display = 'block';
      cambiosProductos = {};
      cargarCategoriasYRenderProductos();
    })
    .catch(() => { document.getElementById('loginErr').textContent = 'Sin conexión, probá de nuevo'; });
}

function cargarCategoriasYRenderProductos(){
  if(categoriasData.length){ renderProductos(); return; }
  fetch(`${WEBAPP_URL}?action=menu&canal=mesa`)
    .then(r => r.json())
    .then(res => { categoriasData = res.categorias || []; renderProductos(); });
}

function cerrarProductos(){
  if(Object.keys(cambiosProductos).length && !confirm('Tenés cambios sin guardar, ¿salir igual y perderlos?')) return;
  document.getElementById('vistaProductos').style.display = 'none';
  document.getElementById('vistaPedidos').style.display = 'block';
}

function nombreCategoria(id){
  const c = categoriasData.find(c => c.id === id);
  return c ? c.nombre : 'Sin categoría';
}

function renderProductos(){
  document.getElementById('productosSub').textContent =
    `${productosData.length} productos · tocá un precio o un switch, y guardá cuando termines`;

  // Agrupar por categoría, respetando el orden de Categorias
  const porCategoria = {};
  productosData.forEach(p => {
    if(!porCategoria[p.categoria_id]) porCategoria[p.categoria_id] = [];
    porCategoria[p.categoria_id].push(p);
  });

  const el = document.getElementById('listaProductos');
  el.innerHTML = Object.keys(porCategoria).map(catId => `
    <div class="cat-block">
      <div class="cat-titulo">${nombreCategoria(catId)}</div>
      ${porCategoria[catId].map(productoRowHtml).join('')}
    </div>
  `).join('');
}

function productoRowHtml(p){
  const activo = isSiJs(p.activo);
  const dispoMesa = isSiJs(p.disponible_mesa);
  const dispoRetiro = isSiJs(p.disponible_retiro);
  const dispoEnvio = isSiJs(p.disponible_envio);
  return `
    <div class="prod-row ${activo ? '' : 'inactivo'}" data-id="${p.id}">
      <div class="prod-nombre">${p.nombre}</div>
      <div class="prod-controles">
        <label class="prod-precio">
          $<input type="number" value="${Number(p.precio)}" min="0" step="50"
            onchange="editarProducto('${p.id}', 'precio', this.valueAsNumber)">
        </label>
        <label class="switch-mini" title="Visible ahora en el menú">
          <input type="checkbox" ${activo ? 'checked' : ''} onchange="editarProducto('${p.id}', 'activo', this.checked)">
          <span>Visible</span>
        </label>
        <label class="switch-mini" title="Disponible para mesa">
          <input type="checkbox" ${dispoMesa ? 'checked' : ''} onchange="editarProducto('${p.id}', 'disponible_mesa', this.checked)">
          <span>Mesa</span>
        </label>
        <label class="switch-mini" title="Disponible para retiro">
          <input type="checkbox" ${dispoRetiro ? 'checked' : ''} onchange="editarProducto('${p.id}', 'disponible_retiro', this.checked)">
          <span>Retiro</span>
        </label>
        <label class="switch-mini" title="Disponible para envío">
          <input type="checkbox" ${dispoEnvio ? 'checked' : ''} onchange="editarProducto('${p.id}', 'disponible_envio', this.checked)">
          <span>Envío</span>
        </label>
      </div>
    </div>`;
}

function isSiJs(v){ return String(v).trim().toUpperCase() === 'SI'; }

function editarProducto(id, campo, valor){
  if(!cambiosProductos[id]) cambiosProductos[id] = { id };
  cambiosProductos[id][campo] = valor;
  // refleja el cambio en memoria para que si tocás otro campo del mismo producto no se pierda
  const p = productosData.find(p => p.id === id);
  if(p) p[campo] = (typeof valor === 'boolean') ? (valor ? 'SI' : 'NO') : valor;
  // atenúa visualmente la fila si quedó "no visible"
  const fila = document.querySelector(`.prod-row[data-id="${CSS.escape(id)}"]`);
  if(fila) fila.classList.toggle('inactivo', !isSiJs(p.activo));
}

function guardarCambiosProductos(){
  const cambios = Object.values(cambiosProductos);
  if(!cambios.length){ showToast('No hay cambios para guardar'); return; }
  postActionConClave('guardarProductos', { productos: cambios }).then(res => {
    if(!res.ok) return showToast('No se pudo guardar: ' + (res.error || ''));
    showToast(`Guardado: ${res.productos_actualizados} producto(s) actualizados`);
    cambiosProductos = {};
  });
}

function cargarPedidos(){
  fetch(`${WEBAPP_URL}?action=listarPedidos`)
    .then(r => r.json())
    .then(res => {
      if(!res.ok) return;
      staffOrders = res.pedidos;
      renderStaffOrders();
    })
    .catch(() => showToast('No se pudo actualizar la lista de pedidos'));
}

/* ======================= ICONOS DE TIPO ======================= */
const TIPO_ICON = {
  mesa:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9h18M5 9v10M19 9v10M3 9l2-5h14l2 5"/></svg>',
  retiro: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8h12l-1 12H7L6 8zM9 8V6a3 3 0 016 0v2"/></svg>',
  envio:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="18" r="2"/><circle cx="17" cy="18" r="2"/><path d="M3 18V7h9v11M12 10h5l3 4v4h-2"/></svg>',
};
const TIPO_LABEL = { mesa:'Mesa', retiro:'Retiro', envio:'Envío' };

function tipoChip(tipo){
  return `<span class="tipo-chip ${tipo}">${TIPO_ICON[tipo]}${TIPO_LABEL[tipo]}</span>`;
}

/* ======================= FILTROS ======================= */
function renderFilters(){
  const counts = {todos: staffOrders.length, nuevo:0, prep:0, listo:0};
  staffOrders.forEach(o => counts[o.estado] = (counts[o.estado]||0) + 1);
  const labels = {todos:'Todos', nuevo:'Nuevos', prep:'En preparación', listo:'Listos'};
  document.getElementById('filters').innerHTML = Object.keys(labels).map(k =>
    `<button class="${filter===k?'active':''}" onclick="setFilter('${k}')">${labels[k]} (${counts[k]||0})</button>`
  ).join('');
}
function setFilter(f){ filter = f; renderStaffOrders(); }

/* ======================= RENDER PRINCIPAL ======================= */
function renderStaffOrders(){
  renderFilters();
  document.getElementById('countLine').textContent =
    `${staffOrders.length} pedido${staffOrders.length===1?'':'s'} activo${staffOrders.length===1?'':'s'}`;

  const visibles = filter === 'todos' ? staffOrders : staffOrders.filter(o => o.estado === filter);
  const el = document.getElementById('ordersList');

  if(visibles.length === 0){ el.innerHTML = '<div class="empty-orders">No hay pedidos en este estado</div>'; return; }

  // Agrupar rondas de mesa; retiro/envío se muestran sueltos
  const mesas = {};
  const sueltos = [];
  visibles.forEach(o => {
    if(o.tipo === 'mesa'){
      if(!mesas[o.mesa]) mesas[o.mesa] = [];
      mesas[o.mesa].push(o);
    } else {
      sueltos.push(o);
    }
  });

  let html = '';
  Object.keys(mesas).sort((a,b)=>a-b).forEach(mesaNum => {
    const rondas = mesas[mesaNum];
    const total = rondas.reduce((s,r) => s + r.total, 0);
    html += `
      <div class="mesa-group">
        <div class="mesa-group-head">
          <span class="titulo">${tipoChip('mesa')} Mesa ${mesaNum} · ${rondas.length} ronda${rondas.length===1?'':'s'}</span>
          <span class="total">${formatPrecio(total)}</span>
        </div>
        ${rondas.map(orderCardHtml).join('')}
        <button class="cerrar-mesa-btn" onclick="cerrarMesa('${mesaNum}', ${rondas.length})">Cerrar mesa e imprimir cuenta</button>
      </div>`;
  });
  sueltos.forEach(o => { html += orderCardHtml(o); });

  el.innerHTML = html;
}

function orderCardHtml(o){
  const encabezado = o.tipo === 'mesa'
    ? `#${o.id_pedido.slice(-4)}`
    : `${tipoChip(o.tipo)} ${o.nombre_cliente || 'Sin nombre'} · #${o.id_pedido.slice(-4)}`;
  return `
    <div class="order-card ${o.estado} tipo-${o.tipo}">
      <div class="head">
        <span class="src">${encabezado}</span>
        <span class="status-pill ${o.estado}">${statusLabel(o.estado)}</span>
      </div>
      <ul>
        ${o.items.map(i => `<li><span class="line">${i.cantidad}× ${i.nombre}${i.categoria ? ` <span style="color:var(--text-muted);font-weight:400">· ${i.categoria}</span>` : ''}${i.nota?`<span class="note">📝 ${i.nota}</span>`:''}</span></li>`).join('')}
      </ul>
      <div class="order-actions">
        ${nextActionButtons(o)}
        <button class="deshacer" onclick="deshacer('${o.id_pedido}')">Deshacer</button>
      </div>
    </div>`;
}

function statusLabel(s){ return {nuevo:'NUEVO', prep:'EN PREPARACIÓN', listo:'LISTO'}[s] || s; }

function nextActionButtons(o){
  if(o.estado === 'nuevo') return `<button class="primary" onclick="tomarPedido('${o.id_pedido}')">Tomar pedido</button>`;
  if(o.estado === 'prep') return `<button class="primary" onclick="marcarListo('${o.id_pedido}', '${o.tipo}')">Marcar listo</button>`;
  // listo:
  if(o.tipo === 'mesa') return `<span style="flex:2;display:flex;align-items:center;justify-content:center;font-size:11.5px;color:var(--text-muted)">Se cierra junto con la mesa</span>`;
  return `<button class="primary" onclick="marcarEntregado('${o.id_pedido}', '${o.tipo}')">Marcar entregado</button>`;
}

/* ======================= ACCIONES ======================= */
function tomarPedido(id){
  const o = staffOrders.find(x => x.id_pedido === id);
  postAction('actualizarEstado', { id_pedido:id, estado:'prep' }).then(res => {
    if(!res.ok) return showToast('No se pudo actualizar: ' + (res.error||''));
    imprimirComprobanteCocina(o);
    showToast('Pedido enviado a cocina');
    cargarPedidos();
  });
}

function marcarListo(id, tipo){
  postAction('actualizarEstado', { id_pedido:id, estado:'listo' }).then(res => {
    if(!res.ok) return showToast('No se pudo actualizar: ' + (res.error||''));
    if(tipo === 'mesa'){
      showToast('Pedido listo para servir');
    } else {
      showToast('📲 Aviso enviado: tu pedido está listo'); // acá se conecta después el WhatsApp real
    }
    cargarPedidos();
  });
}

function marcarEntregado(id, tipo){
  const o = staffOrders.find(x => x.id_pedido === id);
  postAction('actualizarEstado', { id_pedido:id, estado:'cerrado' }).then(res => {
    if(!res.ok) return showToast('No se pudo cerrar: ' + (res.error||''));
    imprimirComprobanteFinal(o, [o]);
    showToast('Pedido cerrado');
    cargarPedidos();
  });
}

function deshacer(id){
  postAction('deshacerEstado', { id_pedido:id }).then(res => {
    if(!res.ok) return showToast('Nada para deshacer');
    showToast('Se deshizo el último cambio');
    cargarPedidos();
  });
}

function cerrarMesa(mesa, cantRondas){
  if(!confirm(`¿Cerrar Mesa ${mesa}? Se van a cerrar sus ${cantRondas} ronda(s) y no se van a poder editar más.`)) return;
  const rondas = staffOrders.filter(o => o.tipo === 'mesa' && String(o.mesa) === String(mesa));
  postAction('cerrarMesa', { mesa }).then(res => {
    if(!res.ok) return showToast('No se pudo cerrar la mesa: ' + (res.error||''));
    imprimirComprobanteFinal({ tipo:'mesa', mesa }, rondas);
    showToast(`Mesa ${mesa} cerrada`);
    cargarPedidos();
  });
}

/* ======================= IMPRESIÓN ======================= */
// Reemplazá LOGO_SRC por la ruta real del logo cuando subas panel-local.html junto con logo.png
const LOGO_SRC = 'logo.png';

function formatPrecio(n){
  return '$' + Math.round(Number(n) || 0).toLocaleString('es-AR');
}
function horaTicket(){
  return new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}) + ' hs.';
}
function fechaHoraTicket(){
  const f = new Date().toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'});
  return `${f} · ${horaTicket()}`;
}

function imprimirComprobanteCocina(o){
  const el = document.getElementById('comprobante');
  let ultimaCategoria = '';
  el.innerHTML = `
    <div class="ticket-logo"><img src="${LOGO_SRC}" alt="Logo"></div>
    <h1>Pedido para cocina</h1>
    <div class="nota">${o.tipo === 'mesa' ? 'MESA ' + o.mesa : TIPO_LABEL[o.tipo].toUpperCase() + (o.nombre_cliente ? ' — ' + o.nombre_cliente : '')}</div>
    <div class="nota">#${o.id_pedido.slice(-4)} · ${horaTicket()}</div>
    <div class="sep"></div>
    ${o.items.map(i => {
      let bloque = '';
      if(i.categoria && i.categoria !== ultimaCategoria){
        bloque += `<div class="cat-label">${i.categoria}</div>`;
        ultimaCategoria = i.categoria;
      }
      bloque += `<div class="linea"><span class="cant">${i.cantidad}×</span><span>${i.nombre}</span></div>`;
      if(i.nota) bloque += `<div class="item-nota">↳ ${i.nota}</div>`;
      return bloque;
    }).join('')}
  `;
  window.print();
}

function imprimirComprobanteFinal(cabecera, rondas){
  const el = document.getElementById('comprobante');
  const total = rondas.reduce((s,r) => s + r.total, 0);
  el.innerHTML = `
    <div class="ticket-logo"><img src="${LOGO_SRC}" alt="Logo"></div>
    <h1>Comprobante</h1>
    <div class="nota">${cabecera.tipo === 'mesa' ? 'Mesa ' + cabecera.mesa : TIPO_LABEL[cabecera.tipo] + (cabecera.nombre_cliente ? ' — ' + cabecera.nombre_cliente : '')}</div>
    <div class="nota">${fechaHoraTicket()}</div>
    <div class="sep"></div>
    ${rondas.map((r,idx) => `
      ${rondas.length>1 ? `<div class="cat-label">Ronda ${idx+1}</div>` : ''}
      ${r.items.map(i => `<div class="linea"><span>${i.cantidad}× ${i.nombre}</span><span>${formatPrecio(i.precio_unit*i.cantidad)}</span></div>`).join('')}
    `).join('')}
    <div class="linea total"><span>TOTAL</span><span>${formatPrecio(total)}</span></div>
    <div class="footer">¡Gracias por tu visita!</div>
    <div class="footer-sub">Te esperamos pronto</div>
  `;
  window.print();
}

/* ======================= TOAST ======================= */
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=> t.classList.remove('show'), 2600);
}
</script>
